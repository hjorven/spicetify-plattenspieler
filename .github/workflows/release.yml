name: Release

# Push a tag like v1.1.0 to build the app and publish a GitHub release with the files.
# The installers (install.sh / install.ps1) download the latest release by default.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
      - name: Package
        run: |
          mkdir -p release/plattenspieler
          cp dist/index.js dist/style.css dist/manifest.json release/plattenspieler/
          (cd release && zip -r plattenspieler.zip plattenspieler)
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then echo "See CHANGELOG.md" > release/notes.md; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Plattenspieler ${GITHUB_REF_NAME}" \
            --notes-file release/notes.md \
            release/plattenspieler.zip dist/index.js dist/style.css dist/manifest.json
